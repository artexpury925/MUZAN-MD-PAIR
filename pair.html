<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MUZAN MD - WhatsApp Linker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <style>
    /* Your existing CSS goes here */
  </style>
</head>
<body>
  <!-- Background video -->
  <video id="background-video" autoplay loop muted playsinline>
    <source src="anime-loop.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Main container -->
  <div class="container">
    <!-- Header Section -->
    <div class="header">
      <div class="logo"><i class="fas fa-robot"></i></div>
      <h1 class="title">MUZAN MD</h1>
      <p class="subtitle">Link your WhatsApp device with cyberpunk vibes</p>
    </div>

    <!-- Mobile Number Input -->
    <div class="input-group" id="inputGroup">
      <label for="mobileNumber" class="input-label">Enter your WhatsApp Number:</label>
      <input type="text" id="mobileNumber" class="input-field" placeholder="e.g. +1234567890" />
    </div>

    <!-- Button to Generate Pair Code -->
    <button id="submit" class="generate-btn">
      <i class="fas fa-key"></i> Generate Pair Code
    </button>

    <!-- Display Code and Copy Button -->
    <div id="codeDisplay" class="qr-display">
      <p>Your pair code will appear here</p>
      <button id="copy" class="copy-btn" onclick="copyCode()">
        <i class="fas fa-copy"></i> Copy Code
      </button>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" style="display:none;">
      <i class="fas fa-spinner fa-spin"></i> Generating...
    </div>
  </div>

  <script>
    // Your existing JavaScript functions for handling code generation and copy functionality
    document.getElementById("submit").addEventListener("click", async (e) => {
      e.preventDefault();
      
      const mobileNumberInput = document.getElementById("mobileNumber");
      const codeDisplay = document.getElementById("codeDisplay");
      const loadingSpinner = document.getElementById("loading");

      const mobileNumber = mobileNumberInput.value.trim();
      if (!mobileNumber) {
        codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Please enter your WhatsApp number</div>';
        return;
      }

      // Show loading spinner and hide code display initially
      loadingSpinner.style.display = "block";
      codeDisplay.innerHTML = '';
      
      try {
        const response = await axios(`/pair?number=${mobileNumber.replace(/[^0-9]/g, "")}`);
        
        const code = response.data.code || "Service Unavailable";
        if (code === "Service Unavailable") {
          codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Service Unavailable</div>';
        } else {
          codeDisplay.innerHTML = `<div class="success-message"><i class="fas fa-check-circle"></i> CODE: ${code}</div>`;
        }
        codeDisplay.style.display = 'flex';
      } catch (error) {
        console.error("Error generating code:", error);
        codeDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Error generating code. Please try again.</div>';
        codeDisplay.style.display = 'flex';
      } finally {
        loadingSpinner.style.display = "none";
      }
    });

    // Function to copy code to clipboard
    function copyCode() {
      const codeDisplay = document.getElementById("codeDisplay").innerText;
      const code = codeDisplay.replace('CODE: ', '');
      navigator.clipboard.writeText(code).then(() => {
        const copyBtn = document.getElementById("copy");
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        setTimeout(() => {
          copyBtn.innerHTML = originalText;
        }, 2000);
      }).catch(err => {
        console.error("Failed to copy text: ", err);
      });
    }
  </script>
</body>
</html>
